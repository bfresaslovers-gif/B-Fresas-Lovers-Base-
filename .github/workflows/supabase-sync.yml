name: Supabase Sync Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check app.js

      - name: Confirm Supabase integration references
        run: |
          grep -q "supabase" app.js
          grep -q "accounting_monthly_summary" app.js
          echo "Supabase integration references found."
